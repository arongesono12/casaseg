project_id = "casaseg"

[auth]
site_url = "https://casaseg.com"
# Keep this list in sync with Supabase Dashboard > Authentication > URL Configuration.
# This file only configures the local stack; the hosted project is not read from here.
additional_redirect_urls = [
  # Expo web dev server (Metro serves web on 8081, not 3000).
  "http://localhost:8081/auth/callback",
  "http://localhost:8081/reset-password",
  "https://casaseg.com/auth/callback",
  "https://casaseg.com/reset-password",
  # Native custom scheme, used by development, preview and store builds alike.
  "casaseg://auth/callback",
  "casaseg://reset-password",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "{{ .Token }} es tu código de verificación de CasaSeg"
content_path = "./supabase/templates/confirmation.html"

[storage.vector]
enabled = false
